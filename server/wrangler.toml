# Wild Mystics account + cloud-save API (Cloudflare Worker + D1).
# Local dev:  npm run db:migrate:local && npm run dev    -> http://localhost:8787
# Deploy:     see README.md (create the D1 database, paste its id below, migrate --remote, deploy).
name = "wild-mystics-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "wild-mystics"
# PLACEHOLDER. Before any --remote command or `wrangler deploy`, run
#   npx wrangler d1 create wild-mystics
# and paste the database_id it prints here. Local dev (--local) and `npm test` work
# with the placeholder as-is; they use a SQLite file under .wrangler/.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
